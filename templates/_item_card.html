<article class="food-card"><a class="food-photo" href="{{ url_for('menu') }}"><img src="{{ item.display_image }}" alt="{{ item.name }}" loading="lazy"><span class="photo-badge">من مطبخ وادي النيل</span></a><div class="food-content"><span class="food-category">{{ item.category }}</span><h3>{{ item.name }}</h3><p>{{ item.description or 'اختيار بحري لذيذ بطابع وادي النيل.' }}</p><div class="food-card-bottom"><strong class="price">{{ ('%.0f'|format(item.price)) }} <small>ج.م</small></strong><form action="{{ url_for('cart_add',item_id=item.id) }}" method="post"><button class="add-button" aria-label="أضف {{ item.name }} إلى السلة">＋ <span>أضف للسلة</span></button></form></div></div></article>
